x-shared: &shared
  environment:
    PYTHONUNBUFFERED: 1

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    <<: *shared
    build: ./auth-service
    ports:
      - "8001:8000"
    volumes:
      - auth_data:/app/data

  task-service:
    <<: *shared
    build: ./task-service
    ports:
      - "8002:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - task_data:/app/data

  analytics-service:
    <<: *shared
    build: ./analytics-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    volumes:
      - analytics_data:/app/data

  api-gateway:
    <<: *shared
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - task-service

volumes:
  auth_data:
  task_data:
  analytics_data:
